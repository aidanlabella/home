<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2933">JEPA-Style Pipeline</text>
  <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#52616b">RocketLanding pixel-grounded world model</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#52616b"/>
    </marker>
    <style>
      .box { fill: #f7f9fb; stroke: #334e68; stroke-width: 3; rx: 16; }
      .latent { fill: #e3f2fd; stroke: #1976d2; stroke-width: 3; rx: 16; }
      .model { fill: #fff3cd; stroke: #b7791f; stroke-width: 3; rx: 16; }
      .goal { fill: #e8f5e9; stroke: #2f855a; stroke-width: 3; rx: 16; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1f2933; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #334e68; }
      .arrow { stroke: #52616b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="55" y="160" width="165" height="88"/>
  <text class="label" x="137.5" y="198" text-anchor="middle">Image</text>
  <text class="small" x="137.5" y="224" text-anchor="middle">observation</text>
  <rect class="latent" x="275" y="160" width="170" height="88"/>
  <text class="label" x="360" y="198" text-anchor="middle">Frozen Visual</text>
  <text class="small" x="360" y="224" text-anchor="middle">encoder</text>
  <rect class="model" x="500" y="160" width="190" height="88"/>
  <text class="label" x="595" y="194" text-anchor="middle">Action-Conditioned</text>
  <text class="small" x="595" y="222" text-anchor="middle">latent predictor</text>
  <rect class="latent" x="735" y="160" width="120" height="88"/>
  <text class="label" x="795" y="198" text-anchor="middle">Next</text>
  <text class="small" x="795" y="224" text-anchor="middle">latent</text>
  <path class="arrow" d="M220 204 H265"/>
  <path class="arrow" d="M445 204 H490"/>
  <path class="arrow" d="M690 204 H725"/>
  <text class="small" x="595" y="280" text-anchor="middle">offline trajectories train predictive dynamics</text>
  <line x1="120" y1="315" x2="780" y2="315" stroke="#cbd5e1" stroke-width="3"/>
  <rect class="goal" x="70" y="375" width="170" height="88"/>
  <text class="label" x="155" y="410" text-anchor="middle">Goal Image</text>
  <text class="small" x="155" y="438" text-anchor="middle">target landing</text>
  <rect class="latent" x="295" y="375" width="170" height="88"/>
  <text class="label" x="380" y="410" text-anchor="middle">Goal Latent</text>
  <text class="small" x="380" y="438" text-anchor="middle">encoded target</text>
  <rect class="model" x="520" y="375" width="160" height="88"/>
  <text class="label" x="600" y="410" text-anchor="middle">MPC</text>
  <text class="small" x="600" y="438" text-anchor="middle">roll out latents</text>
  <rect class="box" x="735" y="375" width="120" height="88"/>
  <text class="label" x="795" y="410" text-anchor="middle">Action</text>
  <text class="small" x="795" y="438" text-anchor="middle">selection</text>
  <path class="arrow" d="M240 419 H285"/>
  <path class="arrow" d="M465 419 H510"/>
  <path class="arrow" d="M680 419 H725"/>
  <text class="small" x="450" y="528" text-anchor="middle">Goal-conditioned planning rolls latent dynamics toward the goal latent.</text>
</svg>
